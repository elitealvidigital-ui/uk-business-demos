<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Outreach Factory Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #08111f;
      color: #eef4ff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 760px;
      padding: 52px;
      border: 1px solid #263850;
      border-radius: 24px;
      background: linear-gradient(145deg, #101e32, #0a1424);
      box-shadow: 0 24px 80px #0008;
    }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 99px;
      background: #1e3a5f;
      color: #8fc7ff;
      font-weight: 700;
    }
    h1 {
      margin: 24px 0 18px;
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1.02;
    }
    .accent { color: #65e6b4; }
    p {
      color: #bac8dc;
      font-size: 19px;
      line-height: 1.7;
    }
    .status {
      margin-top: 30px;
      padding: 18px;
      border: 1px solid #205f4c;
      border-radius: 14px;
      background: #0d2d25;
      color: #8df0c9;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">Preview Concept</span>
    <h1>AI Outreach <span class="accent">Factory</span></h1>
    <p>This repository is ready to host personalized website demos for qualified UK businesses. Each customer will receive their own live demo link.</p>
    <div class="status">GitHub publishing connection is working.</div>
  </main>
</body>
</html>
